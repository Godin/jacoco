name: CI
on:
  push:
    branches-ignore:
      - 'renovate/**'
  pull_request:
jobs:
  Linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          # According to https://github.com/actions/setup-java/blob/v5.4.0/docs/advanced-usage.md#hosted-tool-cache
          # LTS versions of Eclipse Temurin (temurin) are cached on the GitHub Hosted Runners.
          # The tools cache gets updated on a weekly basis.
          - { jdk:  8, distribution: 'temurin' }
          - { jdk:  8, distribution: 'temurin', x64: true }
          - { jdk: 11, distribution: 'temurin' }
          - { jdk: 11, distribution: 'temurin', x64: true }
          - { jdk: 21, distribution: 'temurin' }
          - { jdk: 21, distribution: 'temurin', x64: true }
          - { jdk: 25, distribution: 'temurin' }
          - { jdk: 25, distribution: 'temurin', x64: true }
          - { jdk: 27, distribution: 'zulu' }
          - { jdk: 27, distribution: 'zulu', x64: true }
    name: JDK ${{ matrix.jdk }}${{ matrix.ecj && ' with ECJ' || ''}} ${{ matrix.x64 && 'x64' || 'arm' }}
    runs-on: ${{ matrix.x64 && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          set -x
          ls /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk
          ls /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/21.0.13-9
      # TODO note that this will install on ARM
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: ${{ matrix.distribution }}
          java-version: |
            ${{ matrix.jdk }}
            21
          # Disable problem matcher
          # (https://github.com/actions/setup-java/blob/v6.2.0/.github/java.json)
          # until builds produce fewer warnings
          problem-matcher: false
      - run: |
          set -x
          ls /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk
      - &cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: maven-${{ runner.os }}
      - # Cache will be saved by one job from matrix that completes first,
        # to maximize number of dependencies in cache
        # below command resolves statically declared dependencies
        # (for example misses dynamically downloaded such as formatter for sptoless-maven-plugin)
        # for modules in active by default profiles
        # (for example includes dependencies of `org.jacoco.core.test.validation.kotlin`, but misses ecj)
        run: ./mvnw --quiet dependency:go-offline
      - name: 'Generate toolchains.xml'
        env:
          JDK_VERSION: ${{ matrix.jdk }}
          # https://github.com/actions/runner-images/issues/14204
          JDK_HOME_VARIABLE_NAME: JAVA_HOME_${{ matrix.jdk }}_${{ matrix.x64 && 'X64' || 'AARCH64' }}
        run: |
          echo "
          <toolchains>
            <toolchain>
              <type>jdk</type>
              <provides>
                <id>$JDK_VERSION</id>
                <version>$JDK_VERSION</version>
              </provides>
              <configuration>
                <jdkHome>${!JDK_HOME_VARIABLE_NAME}</jdkHome>
              </configuration>
            </toolchain>
          </toolchains>
          " > toolchains.xml
      - name: 'Build'
        run: |
          ./mvnw -V -B -e \
            verify -Djdk.version=${{ matrix.jdk }} -Dbytecode.version=${{ matrix.jdk }} \
            ${{ matrix.ecj && '-Decj' || ''}} \
            --toolchains=toolchains.xml
  Windows:
    if: false
    runs-on: windows-2025
    environment: ${{ (github.repository == 'jacoco/jacoco' && github.ref == 'refs/heads/master') && 'snapshot' || null }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: |
            8
            21
      - *cache
      - name: 'Generate toolchains.xml'
        env:
          JDK_VERSION: 8
          JDK_HOME_VARIABLE_NAME: JAVA_HOME_8_X64
        shell: bash
        run: |
          echo "
          <toolchains>
            <toolchain>
              <type>jdk</type>
              <provides>
                <id>$JDK_VERSION</id>
                <version>$JDK_VERSION</version>
              </provides>
              <configuration>
                <jdkHome>${!JDK_HOME_VARIABLE_NAME}</jdkHome>
              </configuration>
            </toolchain>
          </toolchains>
          " > toolchains.xml
      - name: 'Build'
        shell: bash
        run: |
          ./mvnw -V -B -e \
            verify -Djdk.version=8 -Dbytecode.version=5 \
            -f org.jacoco.build \
            ${{ secrets.SONARQUBE_TOKEN && 'sonar:sonar' || '' }} \
            -Dsonar.scanner.skipJreProvisioning \
            -Dsonar.organization=default \
            -Dsonar.host.url=https://sonarcloud.io \
            --toolchains=toolchains.xml
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: artifact-upload-step
        with:
          name: jacoco
          path: jacoco/target/*.zip
          if-no-files-found: error
  CI:
    needs:
      - Linux
      - Windows
    # without following condition this job can have result "skipped" if needed job was "skipped"
    # auto-merge ignores skipped jobs even if they are required by branch protection rules
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    steps:
      - name: Check results of all needed jobs
        run: |
          R=$(echo "$NEEDS" | jq --compact-output '[.[].result] | unique')
          if [ "$R" = '["success"]' ]; then
            exit 0
          else
            exit 1
          fi
        env:
          NEEDS: ${{ toJSON(needs) }}
